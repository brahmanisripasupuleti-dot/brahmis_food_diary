
    

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brahmi's Food Diary 🪷</title>
<style>
body{font-family:system-ui,sans-serif;background:#fff8f0;margin:0;color:#333}
header{text-align:center;padding:50px 20px;background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:white}
header h1{margin:0;font-size:32px} header p{opacity:.9}
.container{max-width:850px;margin:25px auto;padding:0 15px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:22px}
.card img{width:100%;height:240px;object-fit:cover}
.card-body{padding:18px}.card-body h3{margin:0 0 5px} small{color:#888}
.btn{background:#ff6b6b;color:white;border:none;padding:10px 18px;border-radius:25px;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}
.btn-outline{background:white;color:#333;border:1px solid #ddd}
#adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;overflow:auto}
.panel{background:white;max-width:420px;margin:60px auto;padding:25px;border-radius:18px}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.login-link{position:absolute;top:15px;right:15px;background:rgba(255,255,255,.2);color:white;padding:6px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,.5)}
</style>
</head>
<body>
<header>
<span class="login-link" onclick="openAdmin()">⚙️ Dashboard</span>
<h1>🪷 Brahmi's Food Diary</h1>
<p>A college girl exploring food | Vegetarian & Healthy</p>
</header>

<div class="container" id="posts"></div>

<!-- DASHBOARD MODAL -->
<div id="adminPanel">
<div class="panel" id="loginBox">
<h2>Admin Login</h2>
<input id="user" placeholder="Username (admin)">
<input id="pass" type="password" placeholder="Password (brahmi123)">
<button class="btn" style="width:100%" onclick="login()">Login</button>
<p id="err" style="color:red"></p>
<button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="closeAdmin()">Close</button>
</div>

<div class="panel" id="dashBox" style="display:none">
<h2>Add New Post</h2>
<input id="title" placeholder="Food Title - ex: Guntur Gongura">
<textarea id="desc" rows="4" placeholder="Description..."></textarea>
<input id="img" placeholder="Image URL (optional)">
<button class="btn" style="width:100%" onclick="addPost()">Publish Now</button>
<button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="logout()">Logout</button>
<button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="closeAdmin()">Back to Blog</button>
<p style="font-size:12px;color:#888;margin-top:10px">Password marchalante code lo brahmi123 ni marchu</p>
</div>
</div>

<script>
const defaultPosts=[
{title:"Welcome to My Food Diary",desc:"Hi! I'm Brahmi, a college girl exploring food. Here I share my hostel food hacks, home-made vegetarian recipes, and healthy bites. Stay tuned! 🍛",date:"2026-09-27",img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c"},
{title:"Hostel Style Tomato Rice",desc:"Simple, spicy and ready in 10 mins! Perfect for busy college days.",date:"2026-09-26",img:"https://images.unsplash.com/photo-1565557623262-b51c2513a641"}
];
let posts=JSON.parse(localStorage.getItem('brahmi_posts')||JSON.stringify(defaultPosts));
function render(){document.getElementById('posts').innerHTML=posts.map(p=>`<div class="card"><img src="${p.img}"><div class="card-body"><h3>${p.title}</h3><small>${p.date}</small><p>${p.desc}</p></div></div>`).join('');}
render();

function openAdmin(){document.getElementById('adminPanel').style.display='block'; if(localStorage.getItem('brahmi_logged')==='yes'){showDash()}}
function closeAdmin(){document.getElementById('adminPanel').style.display='none'}
function showDash(){document.getElementById('loginBox').style.display='none';document.getElementById('dashBox').style.display='block'}
function login(){if(user.value==='admin'&&pass.value==='brahmi123'){localStorage.setItem('brahmi_logged','yes');showDash();}else{err.innerText='Wrong! user:admin pass:brahmi123'}}
function logout(){localStorage.removeItem('brahmi_logged');location.reload()}
function addPost(){if(!title.value)return alert('Title pettu'); posts.unshift({title:title.value,desc:desc.value,img:img.value||'https://images.unsplash.com/photo-1555939594-58d7cb561ad1',date:new Date().toISOString().split('T')[0]});localStorage.setItem('brahmi_posts',JSON.stringify(posts));render();alert('Published!');closeAdmin();title.value=desc.value=img.value=''}
</script>
</body>
</html>
